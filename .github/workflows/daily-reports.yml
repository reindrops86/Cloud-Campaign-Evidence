name: Daily Cloud Campaign Reports

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate daily reports from synthetic evidence
        env:
          PYTHONPATH: .
        run: |
          python app/main.py \
            --seed "AKIAIOSFODNN7EXAMPLE" \
            --seed-type iam_access_key \
            --source synthetic \
            --output data/daily_investigation_output.json \
            --export-stix data/daily_stix_bundle.json \
            --export-markdown reports/daily-research-report.md \
            --export-reports reports/daily

      - name: Upload daily report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-cloud-campaign-reports
          path: |
            reports/daily/
            reports/daily-research-report.md
            data/daily_investigation_output.json
            data/daily_stix_bundle.json
          if-no-files-found: error

      - name: Commit changed daily reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily reports/daily-research-report.md data/daily_investigation_output.json data/daily_stix_bundle.json
          git diff --cached --quiet || git commit -m "Generate daily cloud campaign reports"
          git push