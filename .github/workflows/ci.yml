name: Cloud Campaign Evidence Graph CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Pytest Unit & Integration Test Suite
      env:
        PYTHONPATH: .
      run: |
        python tests/test_pipeline.py

    - name: Run AWS Telemetry & Attack Path Test Suite
      env:
        PYTHONPATH: .
      run: |
        python tests/test_aws_telemetry.py

    - name: Run 20-Case Cloud Campaign Evaluation Benchmark
      env:
        PYTHONPATH: .
      run: |
        python eval/evaluate.py --cases eval/benchmark_cases.json --output eval/ci_eval_report.json

    - name: Run CTI Quality & Deception Evaluation Benchmark
      env:
        PYTHONPATH: .
      run: |
        python eval/deception_evaluator.py --cases eval/deception_cases.json --output eval/ci_deception_report.json
